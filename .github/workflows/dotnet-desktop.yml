# Сборка на каждый push и pull request; мѣтка v* (напримѣръ, v1.0.0) — ещё и выпускъ въ Releases.
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Версія exe берётся изъ мѣтки безъ «v»; безъ мѣтки — 0.0.0-ci.<номеръ прогона>.

name: Сборка и выпускъ

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Version
      shell: pwsh
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        $version = $env:REF_TYPE -eq 'tag' ? $env:REF_NAME.TrimStart('v') : "0.0.0-ci.$env:RUN_NUMBER"
        "VERSION=$version" >> $env:GITHUB_ENV

    # Release: одинъ exe безъ dll, переводы внутри (см. Dehumidifier.csproj)
    - name: Publish win-x64
      run: dotnet publish Dehumidifier.csproj -c Release -o publish -p:Version=${{ env.VERSION }}

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Dehumidifier
        path: publish/Dehumidifier.exe
        if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: Dehumidifier

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        gh release create "$TAG" Dehumidifier.exe --repo "$REPO" --title "$TAG" --generate-notes \
          --notes "Нуженъ [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) (x64)."
